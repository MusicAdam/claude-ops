<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Ops</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e1dc;
  --accent: #2f5bd3; --ok: #1f8a4c; --warn: #b7791f; --bad: #c0392b; --chip: #efeee9;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #9a9993; --line: #33332f;
          --accent: #7a9cff; --ok: #4cc27f; --warn: #e0a546; --bad: #ef6b5e; --chip: #2a2a27; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 14px 20px;
         border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 16px; margin: 0; }
.stat { color: var(--muted); }
.stat b { color: var(--ink); }
main { display: grid; grid-template-columns: 1fr minmax(340px, 460px); gap: 20px; padding: 20px;
       max-width: 1500px; margin: 0 auto; align-items: start; }
main > section { min-width: 0; }  /* a long one-line status is cut off, not widening its column */
#left { position: sticky; top: calc(var(--hdr-h, 64px) + 12px); max-height: calc(100vh - var(--hdr-h, 64px) - 32px); overflow: auto; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; }
                            #left { position: static; max-height: none; overflow: visible; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
textarea, input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
                          border-radius: 6px; padding: 7px 9px; }
textarea { width: 100%; min-height: 120px; resize: vertical; }
#body { min-height: 72px; }
button { font: inherit; border: 1px solid var(--line); background: var(--chip); color: var(--ink);
         border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
label { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.group h3 { font-size: 13px; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
.task { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
        margin-bottom: 8px; cursor: pointer; }
.task.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.task .top { display: flex; gap: 10px; align-items: baseline; }
.task .id { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.task .title { flex: 1; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
.task .now { font-size: 12px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task .now.step { display: flex; align-items: flex-start; white-space: normal; }
.task .now.step .what { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.task .now.step > .muted { flex: none; margin-left: 4px; }
.task .now .say { font-style: italic; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--chip); white-space: nowrap; }
.s-running, .s-gating, .s-merging { color: var(--accent); }
.s-done { color: var(--ok); }
.s-needs_input, .s-review { color: var(--warn); font-weight: 600; }
.s-failed { color: var(--bad); font-weight: 600; }
.s-cancelled { color: var(--muted); }
.s-paused { color: var(--muted); font-weight: 600; }
.pulse::before { content: "●"; margin-right: 4px; animation: p 1.4s infinite; }
@keyframes p { 50% { opacity: .25; } }
.feed { font-family: var(--mono); font-size: 12px; background: var(--bg); border: 1px solid var(--line);
        border-radius: 6px; padding: 8px; max-height: 420px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.feed .say { color: var(--ink); margin: 6px 0; font-family: -apple-system, sans-serif; font-size: 13px; }
.feed .tool { color: var(--muted); }
.feed .ops { color: var(--accent); margin: 6px 0; }
.feed .you { color: var(--warn); margin: 6px 0; font-family: -apple-system, sans-serif; font-size: 13px; }
.msg .note { color: var(--muted); font-size: 11px; margin-top: 4px; }
.callout { border-left: 3px solid var(--warn); background: var(--bg); padding: 8px 10px; border-radius: 4px; margin: 10px 0; white-space: pre-wrap; }
.callout.bad { border-color: var(--bad); }
.callout.ok { border-color: var(--ok); }
pre { white-space: pre-wrap; margin: 0; }
details summary { cursor: pointer; color: var(--muted); margin: 10px 0 6px; }
.err { color: var(--bad); }
ul.ahead { margin: 6px 0 0; padding-left: 18px; max-height: 160px; overflow: auto; }
.tabs { display: flex; gap: 4px; }
.tabs button { background: none; border-color: transparent; color: var(--muted); }
.tabs button.on { background: var(--chip); border-color: var(--line); color: var(--ink); font-weight: 600; }
.hidden { display: none !important; }
#designview { display: grid; grid-template-columns: 260px 1fr; gap: 20px; padding: 20px; max-width: 1500px; margin: 0 auto; }
@media (max-width: 900px) { #designview { grid-template-columns: 1fr; padding: 16px; } }
.chatitem { padding: 8px 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.chatitem.sel { background: var(--panel); border-color: var(--accent); }
.chatitem .sub { color: var(--muted); font-size: 12px; }
.chatitem { position: relative; }
.chatitem .end { position: absolute; top: 4px; right: 4px; display: none; padding: 0 6px; font-size: 12px; line-height: 18px; }
.chatitem:hover .end { display: block; }
.chatitem > div:first-child { padding-right: 18px; }
.chatitem.unread > div:first-child { font-weight: 600; }
.chatitem.unread > div:first-child::before { content: "● "; color: var(--warn); }
#chats > h2, #chats summary { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 10px 6px; }
#chats > h2:first-child { margin-top: 0; }
.tabs .cnt { font-size: 11px; padding: 0 6px; margin-left: 4px; border-radius: 99px; background: var(--warn); color: var(--bg); font-weight: 600; }
.tabs .busy { margin-left: 4px; color: var(--accent); font-size: 10px; }
#chat { display: flex; flex-direction: column; min-height: calc(100vh - 110px); }
#msgs { flex: 1; overflow: auto; padding-bottom: 10px; }
.tchat { max-height: 460px; overflow: auto; margin: 6px 0; }
.msg { max-width: 820px; margin: 0 0 14px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.msg.user { margin-left: auto; background: var(--chip); max-width: 640px; white-space: pre-wrap; }
.msg p { margin: 0 0 8px; } .msg p:last-child { margin: 0; }
.msg h1, .msg h2, .msg h3, .msg h4 { margin: 14px 0 6px; line-height: 1.3; }
.msg h1 { font-size: 18px; } .msg h2 { font-size: 16px; } .msg h3 { font-size: 14.5px; }
.msg h4 { font-size: 14px; color: var(--muted); }
.msg > :first-child { margin-top: 0; }
.msg ul, .msg ol { margin: 0 0 8px; padding-left: 22px; }
.msg li + li { margin-top: 2px; }
.msg li > ul, .msg li > ol { margin: 2px 0 0; }
.msg li > :last-child, .msg blockquote > :last-child { margin-bottom: 0; }
.msg li.check { list-style: none; }
.msg li.check > input, .msg li.check > p > input { margin: 0 6px 0 -20px; vertical-align: -1px; }
.msg li.done { color: var(--muted); }
.msg a { color: var(--accent); }
.msg blockquote { margin: 0 0 8px; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--muted); }
.msg hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
.msg pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; overflow: auto; font: 12px var(--mono); margin: 0 0 8px; }
.msg code { font: 12px var(--mono); background: var(--bg); padding: 1px 4px; border-radius: 4px; }
.msg table { border-collapse: collapse; margin: 0 0 8px; font-size: 13px; }
.msg td, .msg th { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--accent); color: var(--accent); cursor: pointer; background: none; }
.live { color: var(--muted); font: 12px var(--mono); margin: 0 0 14px; }
.composer { position: sticky; bottom: 0; background: var(--bg); padding-top: 10px; }
.composer textarea { min-height: 80px; }
.att { display: block; max-width: 260px; max-height: 200px; margin: 6px 0; border-radius: 6px; border: 1px solid var(--line); }
textarea.dropping { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.chathead { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
.msg.ops { background: none; border-style: dashed; color: var(--muted); font-size: 12px; padding: 6px 12px; }
#specs > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 18px 10px 6px; }
.spechead { color: var(--ink); font-size: 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 10px 14px; }
.spechead .row { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spechead .why { color: var(--muted); margin-top: 4px; }
.spechead details summary { margin: 6px 0 0; }
.specdoc { max-width: none; max-height: 40vh; overflow: auto; margin: 6px 0 0; }
#specs > h2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#specs > h2 button { font-size: 12px; text-transform: none; letter-spacing: 0; padding: 2px 8px; white-space: nowrap; flex: none; }
.specline { font-size: 12px; color: var(--muted); padding: 3px 10px; }
.specline button { font-size: 12px; padding: 0 2px; border: none; background: none; color: var(--accent); cursor: pointer; }
.specline button:disabled { color: var(--muted); cursor: default; }
#specbare summary { font-size: 12px; color: var(--muted); padding: 3px 10px; cursor: pointer; }
#specres { font-size: 12px; padding: 3px 10px; }
#specrefs .specline { padding-left: 22px; }
#specform { margin: 0 4px 8px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
#specform input { width: 100%; }
#specform .row { margin-top: 0; }
.chathead code { font: 12px var(--mono); background: var(--panel); padding: 1px 4px; border-radius: 4px; user-select: all; }
a.origin { color: var(--accent); cursor: pointer; text-decoration: underline; }
.ptag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--muted); }
.projs { padding: 6px; }
.projs > h2 { margin: 6px 8px 6px; }
.prow { border-radius: 6px; border: 1px solid transparent; }
.prow + .prow { margin-top: 2px; }
.prow.on { border-color: var(--accent); background: var(--bg); }
.phead { display: flex; gap: 10px; align-items: baseline; padding: 6px 8px; cursor: pointer; border-radius: 6px; }
.phead:hover { background: var(--bg); }
.phead .pname { font-weight: 600; white-space: nowrap; }
.phead .pstats { flex: 1; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.phead .caret { color: var(--muted); font-size: 10px; }
.pbody { padding: 0 10px 10px; font-size: 13px; }
.pbody .row { margin-top: 8px; }
#archived summary { margin: 6px 8px; }
#archived summary h2 { display: inline; margin: 0; }
.arow { display: flex; gap: 10px; align-items: baseline; padding: 4px 8px; }
.arow .pname { font-weight: 600; }
.arow button { padding: 2px 10px; font-size: 12px; }
.ktag { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--accent); color: var(--accent); }
.deploys h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 4px; font-weight: 600; }
.dep { border-top: 1px solid var(--line); padding: 7px 0; }
.dep .l1 { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.dep .dname { font-weight: 600; }
.dep .nw { white-space: nowrap; }
.dep .l1 .what { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; }
.dep .l2 { color: var(--muted); font-size: 12px; margin-top: 2px; }
.dep button, .dep .btn { padding: 2px 10px; font-size: 12px; }
a.btn { display: inline-block; border: 1px solid var(--line); background: var(--chip); color: var(--accent); border-radius: 6px; text-decoration: none; }
a[data-task] { color: var(--accent); cursor: pointer; }
#dlg { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 10; display: flex; align-items: flex-start; justify-content: center; padding: 8vh 12px 12px; overflow: auto; }
#dlg .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; width: 100%; max-width: 520px; }
#dlg h2 { font-size: 16px; margin: 0 0 6px; }
#dlg .vopts { margin-top: 12px; }
#dlg .vopt { display: flex; color: var(--ink); gap: 8px; padding: 4px 0; align-items: baseline; flex-wrap: wrap; }
#dlg .vopt.off { color: var(--muted); }
#dlg .vopt .why { flex-basis: 100%; padding-left: 24px; font-size: 12px; color: var(--muted); }
#dlg .vopt input[type=text] { width: 110px; padding: 2px 6px; }
#dlg .notebox { display: block; color: var(--ink); margin-top: 12px; }
#dlg .notebox textarea { min-height: 90px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>Claude Ops</h1>
  <select id="proj" title="Project"></select>
  <button id="addproj" title="Add a git repository, or a folder of git repos, as a project">+ Project</button>
  <div class="tabs"><button id="tab-queue" class="on">Queue</button><button id="tab-design" title="Plan work with Claude">Design</button><button id="tab-chat" title="Talk to Claude in the project folder, as in a terminal">Chat</button></div>
  <span class="stat" id="hdr"></span>
  <span style="flex:1"></span>
  <label>Parallel <input id="par" type="number" min="1" max="8" style="width:58px"></label>
  <label>Model <select id="model">
    <option value="">default</option><option value="opus">opus</option>
    <option value="sonnet">sonnet</option><option value="fable">fable</option></select></label>
  <button id="pause" title="Hold queued tasks; running ones carry on"></button>
  <button id="pauseall" class="hidden" title="Stop every running task now; each resumes from where it was"></button>
  <button id="resumeall" class="primary hidden" title="Put every paused task, in every project, back in the queue"></button>
</header>
<main id="queueview">
  <section id="left">
    <div class="card hidden" id="addcard">
      <h2>Add project</h2>
      <input id="ppath" placeholder="Folder path, or a name for a new project" style="width:100%">
      <div class="row"><label>Name <input id="pname" placeholder="from folder" style="width:140px"></label>
        <button class="primary" id="padd">Add</button><button id="pcancel">Cancel</button></div>
      <div id="pmsg" class="muted" style="margin-top:8px;white-space:pre-wrap"></div>
    </div>
    <div id="mains"></div>
    <div class="card" id="detail"></div>
  </section>
  <section id="right">
    <div class="card">
      <h2>New task</h2>
      <textarea id="body" placeholder="Describe what you want. First line is the title. Drop or paste screenshots to attach them."></textarea>
      <div class="row">
        <label id="tprojwrap">Project <select id="tproj"></select></label>
        <label>Priority <select id="prio"><option value="0">normal</option><option value="1">high</option><option value="-1">low</option></select></label>
        <label>After # <input id="after" style="width:60px" placeholder="—"></label>
        <label title="Build it and wait for you to play and approve before merging"><input type="checkbox" id="hold"> Hold for my review</label>
        <label title="Once it merges into dev, queue a release, as Promote does. Tasks it splits into release together, after the last one merges. Starts as the project's default, set on its card."><input type="checkbox" id="autorel"> Release after merge</label>
      </div>
      <div class="row"><button class="primary" id="submit">Queue task</button> <span class="muted">⌘↩</span><span id="formmsg" class="err"></span></div>
    </div>
    <div id="list"></div>
  </section>
</main>
<div id="designview" class="hidden">
  <section>
    <button class="primary" id="newchat" style="width:100%;margin-bottom:12px"></button>
    <div id="chats"></div>
    <div id="specs" class="hidden">
      <h2>OpenSpec changes <button id="specnew" title="Draft a new OpenSpec change with Claude">+ New change</button></h2>
      <div id="specform" class="hidden">
        <label id="snprojwrap">Project <select id="snproj"></select></label>
        <label id="snsubwrap">Repo <select id="snsub"></select></label>
        <input id="sndesc" placeholder="What should the change do? One line." maxlength="2000">
        <div class="row"><button class="primary" id="snstart">Start</button><button id="sncancel">Cancel</button><span id="snmsg" class="err"></span></div>
      </div>
      <div id="speclist"></div>
      <div class="specline" id="specfoot"><button id="specref">Refresh commands</button></div>
      <div id="specrefs" class="hidden"></div>
      <div id="specres" class="hidden"></div>
      <div id="specbare"></div>
    </div>
  </section>
  <section id="chat">
    <div id="chathead" class="chathead"></div>
    <div id="msgs"></div>
    <div class="composer">
      <textarea id="say"></textarea>
      <div class="row"><label id="cprojwrap">Project <select id="cproj"></select></label><button class="primary" id="send">Send</button><span class="muted">⌘↩</span>
        <button id="stopchat" class="danger hidden">Stop</button><span id="chatmsg" class="err"></span><span style="flex:1"></span>
        <button id="endchat" class="hidden" title="Take this chat off your list. It stays under Ended, where you can reopen it">End chat</button>
        <button id="reopenchat" class="hidden" title="Put this chat back on your list">Reopen</button></div>
    </div>
  </section>
</div>
<div id="dlg" class="hidden"></div>
<script>
const $ = s => document.querySelector(s);
let state = null, sel = null, detail = null, detailHtml = "", typing = false, pf = "", focus = "";
try { pf = localStorage.getItem("ops-proj") || ""; focus = localStorage.getItem("ops-focus") || ""; } catch {}
const P = name => ((state && (state.projects.find(p => p.name === name) || archivedP(name))) || {name, title: name});
const archivedP = name => state && (state.archived || []).find(p => p.name === name);
const inView = name => !pf || name === pf;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shas = s => String(s || "").split(" ").map(x => x.slice(0, 8)).join(" ");  // one commit per repo in a workspace
const ago = (t, now) => { if (!t) return ""; const s = Math.max(0, now - t);
  return s < 60 ? `${s|0}s` : s < 3600 ? `${(s/60)|0}m` : s < 86400 ? `${(s/3600).toFixed(1)}h` : `${(s/86400).toFixed(1)}d`; };
// "[image: <path>]" in a message is a screenshot the user attached; show it. Takes escaped text.
const pics = h => h.replace(/\[image: [^\]\n]*\/images\/([\w-]+\.(?:png|jpg|gif|webp))\]\n?/g,
  (_, n) => `<a href="/api/images/${n}" target="_blank"><img class="att" src="/api/images/${n}" alt="${n}"></a>`);
const LABEL = {queued:"queued", running:"working", gating:"checking", merging:"merging", needs_input:"needs you",
               review:"review", done:"done", failed:"failed", cancelled:"cancelled", paused:"paused"};

async function api(path, body) {
  // A read that hangs would hold its poll forever (see single below), so give up on it after 20 seconds.
  const r = await fetch(path, body === undefined ? {signal: AbortSignal.timeout(20000)} :
    {method: "POST", headers: {"Content-Type": "application/json", "X-Ops": "1"}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

// Put html in el unless it is already there. Returns whether it did: if not, the caller skips rewiring it.
function put(el, html) {
  if (el.dataset.html === html) return false;
  el.innerHTML = el.dataset.html = html;
  return true;
}

// Run fn one call at a time. A call made while one runs becomes a single rerun after it, so a click still
// gets fresh data; poll() skips instead, so polls never pile up behind a slow answer.
function single(fn) {
  let running = null, again = false;
  const run = () => {
    if (running) { again = true; return running; }
    return running = (async () => { do { again = false; await fn(); } while (again); })().finally(() => running = null);
  };
  run.poll = () => running || run();
  return run;
}

async function loadState() {
  try { state = await api("/api/state"); } catch (e) { $("#hdr").innerHTML = `<span class="err">daemon not reachable</span>`; return; }
  render();
  if (sel) loadDetail(sel);
}
const refresh = single(loadState);

// Draw everything from the state we have. A click that changes the view calls this at once, then refresh.
function render() {
  if (pf && !state.projects.some(p => p.name === pf)) pf = "";
  if (focus && !state.projects.some(p => p.name === focus)) focus = "";
  // The header filter hides the selected task's project: drop the selection rather than show it as part of this one.
  const st = sel && state.tasks.find(t => t.id === sel);
  if (st && !inView(st.project)) clearSelection();
  renderProjects(); renderHeader(); renderMains(); renderList();

function renderProjects() {
  const opts = (all) => (all ? `<option value="">All projects</option>` : "") +
    state.projects.map(p => `<option value="${esc(p.name)}">${esc(p.title)}</option>`).join("");
  for (const [id, all] of [["#proj", true], ["#tproj", false], ["#cproj", false]]) {
    const el = $(id), v = el.value, html = opts(all);
    if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; el.value = v; }
    if (!all && !el.value) el.selectedIndex = 0;
  }
  $("#proj").value = pf;
  if (pf) { $("#tproj").value = pf; $("#cproj").value = pf; }
  // New tasks default to the focused project; you can still pick another until the focus changes.
  else if (focus && $("#tproj").dataset.f !== focus) { $("#tproj").value = focus; $("#tproj").dataset.f = focus; }
  $("#tprojwrap").classList.toggle("hidden", !!pf);
  $("#cprojwrap").classList.toggle("hidden", !!pf || !!chatSel);
  syncRelease();
}
// "Release after merge" on the form starts as the project's default. It resets when the project or its default

function syncRelease() {
  const name = pf || $("#tproj").value, on = !!P(name).auto_release, k = `${name}:${on}`, el = $("#autorel");
  if (el.dataset.k !== k) { el.checked = on; el.dataset.k = k; }
}
$("#tproj").addEventListener("change", syncRelease);

function renderHeader() {

    `<b>${n(["needs_input","review","failed"])}</b> need you · ` +

  if (document.activeElement !== $("#par")) $("#par").value = s.max_parallel;

// The Design and Chat tabs show how many open chats have a new reply for you, and ● while Claude is replying in one.
function renderTabCounts() {

    const cs = (state.chats || []).filter(c => c.kind === kind && inView(c.project));

const mainMsg = {};  // project -> error from a click, shown until the next success
const LIVE = ["running", "gating", "merging"], NEEDS = ["needs_input", "review", "failed"];
// The focused project is the one expanded in the project list. Clicking a task focuses its project.
function setFocus(name) {

  if (state) { renderProjects(); renderMains(); }
}
function projStats(g) {
  const ts = state.tasks.filter(t => t.project === g.name), n = st => ts.filter(t => st.includes(t.state)).length;
  const r = g.release, busy = r && !["done", "failed", "cancelled"].includes(r.state);
  const need = n(NEEDS), qd = n(["queued"]);
  return [

}
function projBody(g) {

  const r = g.release, busy = r && !["done", "failed", "cancelled"].includes(r.state);
  const msg = mainMsg[g.name] || (!r ? "" : busy ? `Release #${r.id}: ${esc(r.phase || LABEL[r.state] || r.state)}`

    <div class="row">

// ---------------------------------------------------------------- archiving: the card's Archive button and the Archived list

const archiveBtn = g => archAsk && archAsk.name === g.name ? "" :

// ---------------------------------------------------------------- deploys: the card's section and the Deploy dialog
const day = iso => { const d = new Date(iso), y = d.getFullYear() !== new Date().getFullYear();
  return d.toLocaleDateString("en-GB", {day: "numeric", month: "short", ...(y ? {year: "numeric"} : {})}); };
const taskLink = id => `<a data-task="${id}">#${id}</a>`;
function deploysHtml(g) {
  if (!g.deploys.length) return g.deploys_loading ? `<div class="deploys"><h3>Deploys</h3><div class="muted">reading…</div></div>` : "";
  const open = g.deploy_open;
  return `<div class="deploys"><h3>Deploys</h3>` + g.deploys.map(d => {
    const l = d.last, base = d.from || g.main_branch;
    const last = l ? `<span class="nw">${esc(shas(l.commit))}${l.version ? ` (${esc(l.version)})` : ""}</span> · <span class="nw">${ago(l.time, state.now)} ago</span> · ${taskLink(l.task)}` : "never deployed";
    const why = d.error ? `<span class="err">${esc(d.error)}</span>` : d.blocked ? `<span class="s-review">${esc(d.blocked)}</span>`
      : d.behind == null ? "" : d.behind ? `<span class="s-review nw">${d.behind} behind ${esc(base)}</span>` : `<span class="nw">up to date</span>`;
    const stop = d.error || d.blocked || (d.version && d.version.error);
    const queued = d.open && d.open !== open ? `<span class="nw">${taskLink(d.open)} queued</span>` : "";  // its own, waiting behind the open one
    const btn = open ? `<a class="btn" data-task="${open}" title="A deploy of ${esc(g.title)} is open. Open it">Deploying… #${open}</a>
        <button data-deploy="${esc(d.name)}" data-p="${esc(g.name)}" ${stop ? "disabled" : ""} title="Queue another deploy behind it">Queue deploy</button>`
      : `<button class="primary" data-deploy="${esc(d.name)}" data-p="${esc(g.name)}" ${stop ? `disabled title="${esc(stop)}"` : ""}>Deploy</button>`;
    return `<div class="dep"><div class="l1"><span class="dname">${esc(d.name)}</span>
      <span class="what">${[last, why, queued].filter(Boolean).join(" · ")}</span>${btn}</div>${d.has_version ? `<div class="l2">${versionLine(d.version)}</div>` : ""}</div>`;
  }).join("") + `</div>`;
}
function versionLine(v) {
  if (!v) return "version: reading…";

  return [`version <b>${esc(v.current)}</b>`,
    v.released ? `<span class="s-done">released as ${esc(v.released.name)}</span> · ${day(v.released.date)}`
      : `not released yet · ${v.latest_release ? `newest release ${esc(v.latest_release.name)}` : "no releases yet"}`,
    v.latest_build ? `<span class="mono">${esc(v.latest_build.name)}</span>` : "no builds yet"].join(" · ");
}

// The dialog is drawn once when it opens, from the state then; polls leave it alone so your picks and note stay.
const VLABEL = {same: v => `New build on ${v}`, patch: v => `Patch → ${v}`, minor: v => `Minor → ${v}`, major: v => `Major → ${v}`};
let dlg = null;  // {project, target, version}
function closeDeploy() { dlg = null; $("#dlg").classList.add("hidden"); $("#dlg").innerHTML = ""; }
function openDeploy(project, name) {
  const g = P(project), d = (g.deploys || []).find(x => x.name === name);
  if (!d) return;
  const v = d.version;
  dlg = {project, target: name, version: d.has_version ? v : null, stuck: d.has_version && (!v || !!v.error)};
  const src = d.from && g.deploys.find(x => x.name === d.from);
  const fromLine = d.from && src && src.last ? `<div class="muted">ships what ${esc(d.from)} last deployed (${esc(shas(src.last.commit))}${src.last.version ? `, ${esc(src.last.version)}` : ""})</div>` : "";
  const opts = !d.has_version ? "" : !v || v.error ? `<div class="err" style="margin-top:12px">${esc(v ? v.error : "the version is still being read")}</div>`
    : `<div class="vopts">` + v.options.map(o => `<label class="vopt ${o.disabled ? "off" : ""}"><input type="radio" name="dv" value="${o.key}" data-v="${esc(o.version)}" ${o.disabled ? "disabled" : ""} ${o.key === v.default && !o.disabled ? "checked" : ""}>
        ${esc((VLABEL[o.key] || (x => `${o.key} → ${x}`))(o.version))}${o.disabled && o.reason ? `<span class="why">${esc(o.reason)}</span>` : ""}</label>`).join("")
      + `<label class="vopt"><input type="radio" name="dv" value="other"> Other <input type="text" id="dother" placeholder="X.Y.Z" autocomplete="off" spellcheck="false"><span class="err" id="dothererr"></span></label></div>`;
  const busy = g.deploy_open ? `<div class="callout">Deploy ${taskLink(g.deploy_open)} is open. This one queues behind it.</div>` : "";
  $("#dlg").innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-labelledby="dtitle">
    <h2 id="dtitle">Deploy ${esc(name)}</h2>
    <div><span class="mono">${esc(d.commit ? d.commit.show : "")}</span> ${esc(d.commit ? d.commit.subject : "")}</div>${fromLine}
    ${busy}${opts}
    ${d.note ? `<label class="notebox">${esc(d.note)} <span class="muted">(required)</span><textarea id="dnote"></textarea></label>` : ""}
    <div class="row"><button class="primary" id="dgo"></button><button id="dcancel">Cancel</button></div>
    <div id="dmsg" class="err" style="margin-top:8px;white-space:pre-wrap"></div></div>`;
  $("#dlg").classList.remove("hidden");
  $("#dcancel").onclick = closeDeploy;
  $("#dgo").onclick = confirmDeploy;
  $("#dlg").oninput = $("#dlg").onchange = syncDeploy;
  const other = $("#dother");  // clicking or typing in the field picks Other
  if (other) other.onfocus = other.oninput = () => { $("#dlg input[value=other]").checked = true; syncDeploy(); };
  syncDeploy();
  ($("#dlg input[name=dv]:checked") || $("#dnote") || $("#dgo")).focus();
}
// The version the picker stands at, as {choice, version} for the API and the button, or {error}.
function pickedVersion() {
  const r = $("#dlg input[name=dv]:checked");
  if (!r) return {error: "pick a version"};
  if (r.value !== "other") return {choice: r.value, version: r.dataset.v};
  const s = $("#dother").value.trim(), cur = dlg.version.current.split(".").map(Number);
  if (!/^\d+\.\d+\.\d+$/.test(s)) return {error: s ? "Use the form X.Y.Z, such as 3.5.0." : "Type a version."};
  const n = s.split(".").map(Number), higher = n[0] - cur[0] || n[1] - cur[1] || n[2] - cur[2];
  if (higher <= 0) return {error: `It must be higher than the current version ${dlg.version.current}.`};
  return {choice: s, version: s};
}
function syncDeploy() {
  if (!dlg) return;
  const pick = dlg.version && !dlg.stuck ? pickedVersion() : null, note = $("#dnote");
  const other = $("#dlg input[value=other]");
  if ($("#dothererr")) $("#dothererr").textContent = other && other.checked && $("#dother").value.trim() && pick.error ? pick.error : "";
  $("#dgo").textContent = `Deploy ${dlg.target}${pick && pick.version ? ` ${pick.version}` : ""}`;
  $("#dgo").disabled = dlg.stuck || !!(pick && pick.error) || !!(note && !note.value.trim());
}
async function confirmDeploy() {
  if (!dlg || $("#dgo").disabled) return;
  const body = {project: dlg.project, target: dlg.target}, note = $("#dnote");
  if (dlg.version) body.version = pickedVersion().choice;  // same, patch, …: the daemon picks it again at the run
  if (note) body.note = note.value.trim();
  $("#dgo").disabled = true; $("#dmsg").textContent = "";
  try {
    const r = await api("/api/deploys", body);
    // Show the button as Deploying… now, not at the next poll.
    const g = P(dlg.project), d = g.deploys.find(x => x.name === dlg.target);
    if (!g.deploy_open) g.deploy_open = r.id;
    if (d && !d.open) d.open = r.id;
    closeDeploy(); renderMains(); selectTask(r.id); refresh();
  } catch (e) { $("#dmsg").textContent = e.message; syncDeploy(); }
}
// A task link (a deploy's #id) anywhere on the page opens that task; in the dialog it closes the dialog first.
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest("a[data-task]");
  if (!a) return;
  e.preventDefault(); if (dlg) closeDeploy(); selectTask(+a.dataset.task);
});
document.addEventListener("keydown", e => {
  if (!dlg) return;
  if (e.key === "Escape") closeDeploy();
  else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) confirmDeploy();
});
function renderMains() {
  const ps = state.projects.filter(p => inView(p.name)), fx = pf || focus;
  // Keep an open "What would be promoted" open across the 3-second refresh.
  const open = !!document.querySelector("#mains .prow.on details[open]");
  let html = ps.length ? `<div class="card projs"><h2>Projects</h2>` + ps.map(g => {
    const on = g.name === fx;
    return `<div class="prow ${on ? "on" : ""}" data-proj="${esc(g.name)}">
      <div class="phead" title="${on ? "Collapse and show all projects" : "Show only this project"}"><span class="pname">${esc(g.title)}</span>
        <span class="pstats">${projStats(g)}</span><span class="caret">${on ? "▼" : "▶"}</span></div>
      ${on ? `<div class="pbody">${projBody(g)}</div>` : ""}</div>`;
  }).join("") + `</div>` : `<div class="card"><h2>No projects yet</h2>Click <b>+ Project</b> and give the path of a git repository, or of a folder that holds several.</div>`;
  html += archivedHtml();
  if (!put($("#mains"), html)) return;  // nothing changed: leave the page (and its open sections) alone
  if (open) { const d = document.querySelector("#mains .prow.on details"); if (d) d.open = true; }
  document.querySelectorAll("#mains .phead").forEach(h => h.onclick = () => {
    const name = h.parentElement.dataset.proj;
    // Opening a project also filters to it; closing it shows every project again.
    const open = name === (pf || focus);
    setFocus(open ? "" : name);
    setFilter(open ? "" : name); render(); refresh(); if (tab !== "queue") refreshDesign();
  });
  document.querySelectorAll("#mains [data-a]").forEach(b => b.onclick = () => {
    delete mainMsg[b.dataset.p];
    api(`/api/projects/${b.dataset.p}/${b.dataset.a}`, {})
      .then(res => { if (res && res.id) selectTask(res.id); refresh(); })
      .catch(e => { mainMsg[b.dataset.p] = `<span class="err">${esc(e.message)}</span>`; renderMains(); });
  });
  document.querySelectorAll("#mains [data-arch]").forEach(b => b.onclick = () => { archAsk = {name: b.dataset.arch}; renderMains(); });
  document.querySelectorAll("#mains [data-archno]").forEach(b => b.onclick = () => { archAsk = null; renderMains(); });
  document.querySelectorAll("#mains [data-archgo]").forEach(b => b.onclick = () => {
    const name = b.dataset.archgo;
    archAsk = {name, busy: true}; renderMains();
    api(`/api/projects/${encodeURIComponent(name)}/archive`, {})
      .then(() => { archAsk = null; archMsg = ""; refresh(); })
      .catch(e => { archAsk = {name, err: e.message}; renderMains(); });  // the daemon's refusal, such as a task at work
  });

    b.disabled = true;

    api(`/api/projects/${encodeURIComponent(name)}/unarchive`, {})
      .then(() => { archMsg = ""; refresh().then(() => setFocus(name)); })
      .catch(e => { archMsg = e.message; renderMains(); });
  });
  const ad = $("#archived"); if (ad) ad.ontoggle = () => archOpen = ad.open;
  document.querySelectorAll("#mains [data-deploy]").forEach(b => b.onclick = () => openDeploy(b.dataset.p, b.dataset.deploy));
  document.querySelectorAll("#mains [data-rel]").forEach(c => c.onchange = () => {
    delete mainMsg[c.dataset.rel];
    api(`/api/projects/${c.dataset.rel}/release`, {on: c.checked ? 1 : 0}).then(refresh)
      .catch(e => { mainMsg[c.dataset.rel] = `<span class="err">${esc(e.message)}</span>`; refresh(); });
  });
}

function clearSelection() {
  sel = null; detail = null; typing = false;

  delete $("#detail").dataset.id;
}
clearSelection();

function setFilter(name) {
  pf = name || ""; try { localStorage.setItem("ops-proj", pf); } catch {}
  chatSel = null; chatData = null; chatKey = ""; chatSels = {};
}

function selectTask(id) {
  sel = id;
  const t = state && state.tasks.find(x => x.id === id);
  // Asked for a task the header filter hides (e.g. from a chat chip): switch the filter to its project.
  if (t && !inView(t.project)) { setFilter(t.project); renderProjects(); renderHeader(); renderMains(); }
  if (t) setFocus(t.project);
  if (state) renderList();
  // Show the task at once from the list; the full page follows when the daemon answers.
  if (t && $("#detail").dataset.id !== String(id)) {
    $("#detail").innerHTML = detailHtml = `<h2>#${t.id} · <span class="s-${t.state}">${LABEL[t.state] || t.state}</span></h2>
      <div style="font-weight:600;font-size:15px">${esc(t.title)}</div><div class="muted" style="margin-top:8px">Loading…</div>`;
    delete $("#detail").dataset.id;
  }
  loadDetail(id, true);
  // One column on narrow screens: bring the detail, which sits above the list, into view below the header.
  if (matchMedia("(max-width: 900px)").matches)
    scrollTo({top: $("#detail").getBoundingClientRect().top + scrollY - $("header").offsetHeight - 12});
}

function renderList() {
  const groups = [
    ["Needs you", ["needs_input", "review", "failed"]],
    ["In progress", ["running", "gating", "merging"]],
    ["Paused", ["paused"]],
    ["Queued", ["queued"]],
    ["Finished", ["done", "cancelled"]],
  ];
  const now = state.now;
  const html = groups.map(([name, sts]) => {
    let ts = state.tasks.filter(t => sts.includes(t.state) && inView(t.project));
    if (name === "Queued") ts = ts.sort((a, b) => b.priority - a.priority || a.id - b.id);
    if (name === "Finished") ts = ts.slice(0, 40);
    if (!ts.length) return "";
    return `<div class="group"><h3>${name} (${ts.length})</h3>` + ts.map(t => {
      const live = ["running", "gating", "merging"].includes(t.state);
      const sub = [
        pf ? "" : `<span class="ptag">${esc(P(t.project).title)}${archivedP(t.project) ? " (archived)" : ""}</span>`,
        t.depends_on ? `after #${t.depends_on}` : "",
        t.kind === "release" || t.kind === "deploy" ? `<span class="ktag">${t.kind}</span>` : "",
        t.parent ? `from #${t.parent}` : "",
        t.origin ? `sent by ${esc(t.origin.words)}` : "",
        t.hold ? "hold for review" : "",
        t.auto_release ? "release after merge" : "",
        t.priority > 0 ? "high priority" : t.priority < 0 ? "low priority" : "",
        live ? `${ago(t.started, now)} running` : t.finished ? `${ago(t.finished, now)} ago` : `queued ${ago(t.created, now)} ago`,
        t.cost ? `$${t.cost.toFixed(2)}` : "",
      ].filter(Boolean).join(" · ");
      return `<div class="task ${sel === t.id ? "sel" : ""}" data-id="${t.id}">
        <div class="top"><span class="id">#${t.id}</span><span class="title">${esc(t.title)}</span>
        <span class="badge s-${t.state} ${live ? "pulse" : ""}">${LABEL[t.state] || t.state}</span></div>
        ${nowLine(t, now)}<div class="sub">${sub}</div></div>`;
    }).join("") + "</div>";
  }).join("") || `<div class="muted">No tasks yet.</div>`;
  if (!put($("#list"), html)) return;
  document.querySelectorAll(".task").forEach(el => el.onclick = () => selectTask(+el.dataset.id));
}

// One line under a task in the list: what it is doing right now, what it waits for, or how it ended.
function nowLine(t, now) {
  const first = s => String(s || "").trim().split("\n")[0];
  const since = (ts, fmt = x => `${x} ago`) => ts ? ` <span class="muted">· ${fmt(ago(ts, now))}</span>` : "";
  const s = t.step, e = t.last_event;
  let text = "", h = "", cls = "muted";  // text is the whole line, also the tooltip when it is cut off
  if (t.state === "running" && s) {
    // What the worker's latest step does, in words, then what it last said, and how long since its
    // transcript last moved. The step and the time stay in view when its words are cut off.
    const say = s.k === "say" ? s.t : s.say;
    text = [s.k === "tool" && `▸ ${s.t}`, say && `“${say}”`].filter(Boolean).join(" ");
    cls = "step";
    h = `<span class="what">${s.k === "tool" ? `▸ ${esc(s.t)} ` : ""}${say ? `<span class="say">“${esc(say)}”</span>` : ""}</span>` + since(s.ts);
  } else if (LIVE.includes(t.state)) { text = t.phase || "starting"; h = esc(text) + since(t.phase_since, x => `for ${x}`); cls = "s-running"; }
  else if (t.state === "queued") text = archivedP(t.project) ? "archived project: restore it to run this" : t.wait || "";
  else if (t.state === "paused") { text = e ? e.text : ""; h = text && esc(text) + since(e.ts); }
  else if (t.state === "needs_input") { text = first(t.question); h = text && `<b>Question:</b> ${esc(text)}`; cls = ""; }
  else if (t.state === "review") { text = first(t.summary) || "waiting for your review"; cls = ""; }
  else if (t.state === "failed") { text = first(t.error); cls = "err"; }
  else if (t.state === "done") text = first(t.summary);
  return text ? `<div class="now ${cls}" title="${esc(text)}">${h || esc(text)}</div>` : "";
}

// A poll's read is skipped while another is under way; a click's read always goes, and an answer that a
// newer read has overtaken is dropped, so a slow answer can't draw the task you just left.
let detailSeq = 0, detailBusy = false;
async function loadDetail(id, fresh) {
  if (!fresh && (typing || detailBusy)) return;
  const seq = ++detailSeq;
  detailBusy = true;
  let d;
  try { d = await api(`/api/tasks/${id}`); } catch { return; } finally { if (seq === detailSeq) detailBusy = false; }
  if (sel !== id || seq !== detailSeq) return;
  detail = d;
  if (!inView(detail.project)) {
    if (!fresh) { clearSelection(); return; }
    setFilter(detail.project); refresh();
  }
  if (fresh && detail.project !== focus) setFocus(detail.project);
  const t = detail, live = ["running", "gating", "merging"].includes(t.state);
  const btn = (act, label, cls = "") => `<button class="${cls}" data-act="${act}">${label}</button>`;
  let actions = "";
  if (t.state === "review") actions = (t.can_play ? btn("play", "▶ Try this build", "primary") : "") + btn("approve", "Approve & merge");
  if (["queued", "running", "gating"].includes(t.state)) actions += btn("pause", "❚❚ Pause");
  if (t.state === "paused") actions += btn("resume", "▶ Resume", "primary");
  if (["failed", "cancelled"].includes(t.state)) actions += btn("retry", "Retry");
  if (!["done", "cancelled"].includes(t.state)) actions += btn("cancel", "Cancel", "danger");
  if (t.kind === "task" && !["done", "failed", "cancelled"].includes(t.state))
    actions += `<label title="Once it merges into dev, queue a release, as Promote does"><input type="checkbox" data-act="release" ${t.auto_release ? "checked" : ""}> Release after merge</label>`;

  const html = `
    <h2>#${t.id} · <span class="s-${t.state}">${LABEL[t.state] || t.state}</span>${live && t.phase ? ` · ${esc(t.phase)}` : ""}</h2>
    <div style="font-weight:600;font-size:15px">${esc(t.title)}</div>
    ${originLine(t.origin, "Sent by")}
    <div class="muted mono" style="margin:4px 0">${esc(P(t.project).title)} · ${esc(t.branch || "")}${t.merged ? ` → ${esc(t.kind === "release" ? P(t.project).main_branch || "main" : P(t.project).dev_branch || "dev")} ${esc(t.merged_show || shas(t.merged))}` : ""}${t.kind === "release" && t.base && !t.merged ? `checking ${esc(t.base_show || shas(t.base))}` : ""}${t.kind === "deploy" && t.base ? `deploying ${esc(t.base_show || shas(t.base))}` : ""}${t.rounds ? ` · fix rounds: ${t.rounds}` : ""}</div>
    ${t.question ? `<div class="callout"><b>Question:</b> ${esc(t.question)}</div>
      <textarea id="answer" placeholder="Your answer (drop or paste screenshots to attach them)" style="min-height:70px"></textarea>
      <div class="row">${btn("answer", "Send answer", "primary")}</div>` : ""}
    ${t.state === "review" ? `<textarea id="feedback" placeholder="Not right? Say what to change (drop or paste screenshots to attach them)" style="min-height:60px;margin-top:10px"></textarea>
      <div class="row">${btn("reject", "Send back with feedback")}</div>` : ""}
    ${t.summary ? `<div class="callout ok">${esc(t.summary)}</div>` : ""}
    ${t.error ? `<div class="callout bad"><pre class="mono">${esc(t.error)}</pre></div>` : ""}
    <div class="row">${actions}</div>
    ${t.can_steer || t.can_chat || t.chat.length ? `<details data-k="chat" open><summary>${t.can_steer ? "Talk to the worker" : "Ask the worker"}</summary>
      <div class="tchat">${t.chat.map(m => m.role === "assistant" ? `<div class="msg">${md(m.text)}</div>`
          : `<div class="msg user">${pics(esc(m.text))}${m.role === "steer" ? `<div class="note">${steerNote(t, m)}</div>` : ""}</div>`).join("")}
        ${t.chat_live ? `<div class="live"><span class="pulse s-running">Claude is thinking</span>${t.chat_live.map(l => `<div>  ${esc(l)}</div>`).join("")}</div>` : ""}</div>
      ${t.state === "paused" && t.can_chat ? `<textarea id="ask" placeholder="Ask about this work now (read-only), or send a message the worker gets when you resume the task. Drop or paste screenshots to attach them. (⌘↩ asks)" style="min-height:60px"></textarea>
        <div class="row">${t.chat_live ? btn("stopask", "Stop") : btn("ask", "Ask", "primary")}${btn("steer", "Send when it resumes")}</div>`
      : t.can_steer ? `<textarea id="ask" placeholder="Steer the worker: change direction, add a requirement, or ask what it is doing. It reads your message after its current step. Drop or paste screenshots to attach them. (⌘↩ sends)" style="min-height:60px"></textarea>
        <div class="row">${btn("steer", "Send", "primary")}</div>`
      : t.can_chat ? `<textarea id="ask" placeholder="Ask about this work: why it did something, how it works, what it tested. Claude can read the code but not change it. Drop or paste screenshots to attach them. (⌘↩ sends)" style="min-height:60px"></textarea>
        <div class="row">${t.chat_live ? btn("stopask", "Stop") : btn("ask", "Ask", "primary")}</div>` : ""}</details>` : ""}
    <details data-k="body" ${t.state === "queued" ? "open" : ""}><summary>Task description</summary><pre>${pics(esc(t.body))}</pre></details>
    ${t.kind === "deploy" ? "" : `<details data-k="feed" open><summary>Worker activity</summary>
      <div class="feed" id="feed">${t.activity.map(a => `<div class="${a.k}">${a.k === "tool" ? "  " : ""}${esc(a.t)}</div>`).join("") || '<span class="muted">nothing yet</span>'}</div></details>`}
    ${t.kind === "deploy" ? `<details data-k="dlog" open><summary>Deploy log</summary>
      <div class="feed" id="feed">${t.log ? esc(t.log) : '<span class="muted">nothing yet</span>'}</div></details>` : ""}
    ${t.diffstat ? `<details data-k="files"><summary>Files changed</summary><pre class="mono">${esc(t.diffstat)}</pre></details>` : ""}
    <details data-k="log"><summary>Queue log</summary><div class="mono">${t.events.map(e => `<div><span class="muted">${new Date(e.ts * 1000).toLocaleString()}</span> ${esc(e.text)}</div>`).join("")}</div></details>
    <div id="actmsg" class="err"></div>`;
  // This redraws every few seconds. Leave the page alone when nothing changed or you are selecting text,
  // and otherwise keep what you were reading: each scroll box stays where you left it (or follows the end
  // if you were at the end), and each section stays open or closed as you set it.
  const box = $("#detail"), same = !fresh && box.dataset.id === String(t.id);
  if (same && detailHtml === html) return;
  const pick = getSelection();
  if (same && pick && !pick.isCollapsed && box.contains(pick.anchorNode)) return;
  const scrolls = [...box.querySelectorAll("#feed, .tchat")].map(el => [el.id || el.className, el.scrollTop,
    el.scrollTop + el.clientHeight >= el.scrollHeight - 30]);
  const opens = Object.fromEntries([...box.querySelectorAll("details[data-k]")].map(d => [d.dataset.k, d.open]));
  box.innerHTML = detailHtml = html; box.dataset.id = t.id;
  if (same) box.querySelectorAll("details[data-k]").forEach(d => { if (d.dataset.k in opens) d.open = opens[d.dataset.k]; });
  for (const el of box.querySelectorAll("#feed, .tchat")) {
    const was = same && scrolls.find(s => s[0] === (el.id || el.className));
    el.scrollTop = !was || was[2] ? el.scrollHeight : was[1];
  }
  document.querySelectorAll("#detail [data-act]").forEach(b => b.onclick = () => act(t.id, b.dataset.act));
  box.querySelectorAll("a.origin").forEach(a => a.onclick = () => openOrigin(t.origin));
  document.querySelectorAll("#detail textarea").forEach(el => { el.onfocus = () => typing = true; el.onblur = () => typing = !!el.value; });
  const ask = $("#ask"); if (ask) ask.onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) act(t.id, t.can_steer && !(t.state === "paused" && t.can_chat) ? "steer" : "ask"); };
}

// A task or chat another project's session sent: who sent it, as a link to that task or chat.
function originLine(o, verb) {
  return o ? `<div class="muted" style="margin:4px 0">${verb} <a class="origin">${esc(o.words)}</a>${o.title ? ` · ${esc(o.title)}` : ""}</div>` : "";
}
function openOrigin(o) {
  if (o.ref.startsWith("task:")) { showTab("queue"); selectTask(o.id); refresh(); return; }
  if (!inView(o.project)) { setFilter(o.project); renderProjects(); renderHeader(); renderMains(); }
  showTab(o.kind === "project" ? "chat" : "design"); selectChat(o.id);
}

// Where a message to a working worker stands. One that waits goes to the worker's next turn, and nothing merges first.
function steerNote(t, m) {
  if (m.delivered) return "✓ the worker got this";
  if (t.steer_live) return "sent · the worker reads it after its current step";
  if (t.state === "queued") return "waiting · the worker gets it when it starts";
  if (t.state === "paused") return "waiting · the worker gets it when you resume the task";
  if (["running", "gating"].includes(t.state)) return "waiting · the worker gets it at its next turn, before anything merges";
  if (["done", "cancelled"].includes(t.state)) return "not delivered · the task ended first";
  return "waiting · the worker gets it on its next turn (Send answer, Send back or Retry)";
}

async function act(id, a) {
  const body = {};
  if (a === "answer") { body.answer = $("#answer").value.trim(); if (!body.answer) return; }
  if (a === "reject") { body.feedback = $("#feedback").value.trim(); if (!body.feedback) return; }
  if (a === "release") body.on = $("#detail [data-act=release]").checked ? 1 : 0;
  if (a === "ask" || a === "steer") { body.text = $("#ask").value.trim(); if (!body.text) return; }
  if (a === "cancel" && !document.getElementById("actmsg").dataset.armed) {
    const m = document.getElementById("actmsg"); m.dataset.armed = 1; m.textContent = "Click Cancel again to stop this task."; return;
  }
  try { await api(`/api/tasks/${id}/${a}`, body); typing = false; refresh(); }
  catch (e) { $("#actmsg").textContent = e.message; }
}

async function submit() {
  const body = $("#body").value.trim();
  if (!body) return;
  try {
    const project = pf || $("#tproj").value;
    if (!project) throw new Error("pick a project");
    const r = await api("/api/tasks", {project, body, priority: +$("#prio").value, hold: $("#hold").checked ? 1 : 0, release: $("#autorel").checked ? 1 : 0, depends_on: $("#after").value.trim()});
    $("#body").value = ""; $("#after").value = ""; $("#formmsg").textContent = ""; delete $("#autorel").dataset.k; sel = r.id; setFocus(project); refresh();
  } catch (e) { $("#formmsg").textContent = e.message; }
}
$("#submit").onclick = submit;
$("#body").onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) submit(); };
$("#pause").onclick = () => api("/api/settings", {paused: state.settings.paused === "1" ? "0" : "1"}).then(refresh);
$("#pauseall").onclick = () => api("/api/pause-all", {}).then(refresh);
$("#resumeall").onclick = () => api("/api/resume-all", {}).then(refresh);
$("#par").onchange = () => api("/api/settings", {max_parallel: Math.max(1, +$("#par").value || 1)}).then(refresh);
$("#model").onchange = () => api("/api/settings", {model: $("#model").value}).then(refresh);
$("#proj").onchange = () => {
  setFilter($("#proj").value); if (state) render(); refresh(); if (tab !== "queue") refreshDesign();
};
$("#addproj").onclick = () => { showTab("queue"); $("#addcard").classList.remove("hidden"); $("#ppath").focus(); };
$("#pcancel").onclick = () => $("#addcard").classList.add("hidden");
$("#padd").onclick = () => addProject(false);
async function addProject(create) {
  try {
    const path = $("#ppath").value.trim();
    if (!create) {
      const c = await api("/api/projects", {path, check: true});
      if (!c.exists) {
        $("#pmsg").innerHTML = `<span class="mono">${esc(c.repo)}</span> does not exist.<div class="row"><button class="primary" id="pcreate">Create it as a new git repo</button></div>`;
        $("#pcreate").onclick = () => addProject(true);
        return;
      }
    }
    const r = await api("/api/projects", {path, name: $("#pname").value.trim(), create});
    $("#pmsg").innerHTML = `Added <b>${esc(r.name)}</b>. Its config is <span class="mono">${esc(r.config)}</span>. Check the gate and app commands there, then press Reload below if you edit it.<div class="row"><button id="preload">Reload projects</button></div>`;
    $("#preload").onclick = () => api("/api/projects/reload", {}).then(refresh);
    pf = r.name; try { localStorage.setItem("ops-proj", pf); } catch {}
    refresh();
  } catch (e) { $("#pmsg").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

// ---------------------------------------------------------------- design and chat tabs

try { tab = localStorage.getItem("ops-tab") || "queue"; chatSels = JSON.parse(localStorage.getItem("ops-chats") || "{}"); } catch {}

$("#tab-queue").onclick = () => showTab("queue");
$("#tab-design").onclick = () => showTab("design");
$("#tab-chat").onclick = () => showTab("chat");

// Markdown for chat replies and OpenSpec files, in house. The source is HTML-escaped first, so raw HTML never
// renders and every pattern below matches escaped text (a quote's ">" is "&gt;"). With idPrefix each heading gets
// an id (idPrefix + slug, -1, -2 … for repeats); without it there are none, so chat bubbles on one page can't collide.
const MD = {
  fence: /^( {0,3})(`{3,}|~{3,})\s*([\w+#.-]*)/,
  head: /^ {0,3}(#{1,6})\s+(.*?)(?:\s+#+)?\s*$/,
  hr: /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/,
  quote: /^ {0,3}&gt; ?/,
  item: /^( *)([-*+]|(\d{1,9})[.)])(?:[ \t]+|$)/,
  sep: /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/,
};
const mdIsSep = l => l.includes("|") && MD.sep.test(l);
const mdTable = (lines, i) => /^\s*\|/.test(lines[i]) || (lines[i].includes("|") && i + 1 < lines.length && mdIsSep(lines[i + 1]));
// A line that ends a paragraph: any block start, but only a list that starts at 1 (so "2024. was …" stays text).
const mdBreaks = l => { const m = l.match(MD.item);
  return MD.fence.test(l) || MD.head.test(l) || MD.hr.test(l) || MD.quote.test(l) || /^\s*\|/.test(l) || (m && (!m[3] || +m[3] === 1)); };
// Only http(s), relative paths and #anchors link; javascript:, data: and any other scheme stay plain text.
const mdSafeUrl = u => /^https?:\/\//i.test(u) || !/^[^/?#]*:/.test(u);
const mdEmph = s => s
  .replace(/\*\*\*(?=\S)([\s\S]*?\S)\*\*\*/g, "<b><i>$1</i></b>")
  .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, "<b>$1</b>")
  .replace(/(^|[^\w*])\*(?=[^\s*])([^*]*?[^\s*])\*(?![\w*])/g, "$1<i>$2</i>")
  .replace(/(^|[^\w])_(?=[^\s_])([^_]*?[^\s_])_(?!\w)/g, "$1<i>$2</i>")
  .replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<del>$1</del>");
function inline(s, ctx = {}) {
  // Code spans, escapes and links are set aside first, so no formatting reaches inside them.
  const keep = [], put = h => `\u0000${keep.push(h) - 1}\u0000`;
  const link = (text, url) => {
    const local = url.startsWith("#"), href = local && ctx.idPrefix ? "#" + esc(ctx.idPrefix) + url.slice(1) : url;
    return put(`<a href="${href}"${local ? "" : ' target="_blank" rel="noopener"'}>${text}</a>`);
  };
  s = s.replace(/(`+)([^`]|[^`][\s\S]*?[^`])\1(?!`)/g, (m, f, c) => put(`<code>${c.replace(/^ ([\s\S]*) $/, "$1")}</code>`))
       .replace(/\\([\\`*_~[\]()#+\-.!|{}])/g, (m, c) => put(c))
       .replace(/\[([^\]]*)\]\(((?:[^\s()]|\([^\s()]*\))+)\)/g, (m, t, u) => mdSafeUrl(u) ? link(mdEmph(t), u) : t)
       .replace(/\bhttps?:\/\/[^\s\u0000]+/gi, u => {
         let rest = ""; const cut = u.search(/&(lt|gt|quot);/);
         if (cut >= 0) { rest = u.slice(cut); u = u.slice(0, cut); }
         for (;;) {  // trailing punctuation is the sentence's, and so is a ")" the URL never opened
           const c = u.slice(-1), opens = u.split("(").length, closes = u.split(")").length;
           if (!(".,;:!?*_~'\"]".includes(c) || (c === ")" && closes > opens))) break;
           rest = c + rest; u = u.slice(0, -1);
         }
         return (/^https?:\/\/./i.test(u) ? link(u, u) : u) + rest;
       });
  s = mdEmph(s);
  while (s.includes("\u0000")) s = s.replace(/\u0000(\d+)\u0000/g, (m, n) => keep[n]);

}

    + (d.session_id ? ` · continue in a terminal: <code>cd ${esc(d.cwd)} && claude --resume ${esc(d.session_id)}</code>` : "")
    : d && d.spec_view ? specHead(d)
    : d && d.spec_draft ? `<div class="spechead"><b>Drafting a new OpenSpec change</b>${d.spec_sub ? ` in <code>${esc(d.spec_sub)}/</code>` : ""}
      <div class="why">No change is attached yet. When a reply creates one folder in <code>openspec/changes/</code>, this chat becomes that change's chat and its files are saved to ${esc(P(d.project).dev_branch || "dev")}.</div></div>` : "";
  if (d && d.origin) {
    $("#chathead").insertAdjacentHTML("afterbegin", originLine(d.origin, "Started by"));
    $("#chathead").querySelector("a.origin").onclick = () => openOrigin(d.origin);
  }
  if (d && d.ended) $("#chathead").insertAdjacentHTML("afterbegin", `<div class="callout">You ended this chat. Send a message or click Reopen to put it back on your list.</div>`);
  $("#chathead").querySelectorAll("[data-plan]").forEach(b => b.onclick = () => queueSpec(b.dataset.plan));
  $("#chathead").querySelectorAll("details[data-file]").forEach(el => el.ontoggle = () => {
    el.open ? specOpen.add(el.dataset.file) : specOpen.delete(el.dataset.file); });
  for (const [id, k] of [["#spechold", "hold"], ["#specrel", "release"]])
    if ($(id)) $(id).onchange = e => { specOpts[k] = e.target.checked; };
  if (!d) { box.innerHTML = `<div class="muted" style="padding:20px 0">${TABTEXT[tab].intro}</div>`; return; }
  box.innerHTML = d.msgs.map(m => m.role === "user"
      ? `<div class="msg user">${pics(esc(m.text.replace(/^\[ops:[^\n]*\]\n\n/, "")))}</div>`
      : `<div class="msg ${m.role === "ops" ? "ops" : ""}">${md(m.text)}${m.tasks.length ? `<div class="chips">${m.tasks.map(t => `<button class="chip" data-task="${t.id}">#${t.id} ${esc(t.title || "")} · ${LABEL[t.state] || t.state}</button>`).join("")}</div>` : ""}</div>`).join("")
    + (thinking ? `<div class="live"><span class="pulse s-running">Claude is thinking</span>${d.live.map(l => `<div>  ${esc(l)}</div>`).join("")}</div>` : "");
  box.querySelectorAll("[data-task]").forEach(b => b.onclick = () => { showTab("queue"); selectTask(+b.dataset.task); refresh(); });
  if (stick || thinking) box.scrollTop = box.scrollHeight;
}
async function sendChat() {
  const text = $("#say").value.trim();
  if (!text) return;
  try {
    if (chatSel) await api(`/api/designs/${chatSel}/say`, {text});
    else {
      const project = pf || $("#cproj").value;
      if (!project) throw new Error("pick a project");
      const r = await api("/api/designs", {project, text, kind: KIND[tab]}); selectChat(r.id); }
    $("#say").value = ""; $("#chatmsg").textContent = ""; chatKey = ""; refreshDesign();
  } catch (e) { $("#chatmsg").textContent = e.message; }
}
$("#send").onclick = sendChat;
$("#say").onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) sendChat(); };
$("#stopchat").onclick = () => api(`/api/designs/${chatSel}/stop`, {}).then(refreshDesign);
async function endChat(id) {
  const c = chatList.find(x => x.id === id);
  if (c && c.state === "thinking" && !confirm("Claude is still replying. End the chat and stop the reply?")) return;
  try {
    await api(`/api/designs/${id}/end`, {});
    if (id === chatSel) selectChat(null); else refreshDesign();
    refresh();
  } catch (e) { $("#chatmsg").textContent = e.message; }
}
$("#endchat").onclick = () => endChat(chatSel);
$("#reopenchat").onclick = () => api(`/api/designs/${chatSel}/reopen`, {}).then(() => { chatKey = ""; refreshDesign(); refresh(); })
  .catch(e => { $("#chatmsg").textContent = e.message; });
$("#newchat").onclick = () => { selectChat(null); chatData = null; renderProjects(); $("#say").focus(); };

// The header wraps to two lines on narrow windows or when it gains buttons; keep #left just below it.
new ResizeObserver(() => document.documentElement.style.setProperty("--hdr-h", $("header").offsetHeight + "px")).observe($("header"));

// ---------------------------------------------------------------- screenshots: drop or paste into any message box
// The image is uploaded and "[image: <path>]" goes into the text at the cursor; the daemon lets Claude read it.
const imageFiles = dt => [...((dt && dt.files) || [])].filter(f => f.type.startsWith("image/"));
function dropBox(el) {  // the textarea a drop on el goes to: el itself, or the message box of the panel it is in
  if (!el || !el.closest) return null;
  const ta = el.closest("textarea"); if (ta) return ta;
  for (const zone of [el.closest("details"), el.closest("#chat, #detail, #right .card")])
    if (zone && zone.querySelector("textarea")) return zone.querySelector("textarea");
  return null;
}
let dropping = null;
function markDrop(ta) { if (dropping !== ta) { dropping?.classList.remove("dropping"); ta?.classList.add("dropping"); dropping = ta; } }
async function attachImages(ta, files) {
  const id = ta.id, msg = $({say: "#chatmsg", body: "#formmsg"}[id] || "#actmsg");
  typing = true;  // keep the task page from redrawing the box mid-upload
  for (const f of files) {
    try {
      const data = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => no(r.error); r.readAsDataURL(f); });
      const img = await api("/api/images", {data});
      if (!ta.isConnected) ta = document.getElementById(id); if (!ta) return;
      const at = ta.selectionStart ?? ta.value.length, before = ta.value.slice(0, at);
      const ins = (before && !before.endsWith("\n") ? "\n" : "") + `[image: ${img.path}]\n`;
      ta.value = before + ins + ta.value.slice(ta.selectionEnd ?? at);
      ta.selectionStart = ta.selectionEnd = at + ins.length;
      if (msg) msg.textContent = "";
    } catch (e) { if (msg) msg.textContent = `couldn't attach ${f.name}: ${e.message}`; }
  }
  ta?.focus();
}
document.addEventListener("dragover", e => {
  if (![...e.dataTransfer.types].includes("Files")) return;
  e.preventDefault();  // a drop anywhere must not navigate away to the file
  const ta = dropBox(e.target); e.dataTransfer.dropEffect = ta ? "copy" : "none"; markDrop(ta);
});
document.addEventListener("dragleave", e => { if (!e.relatedTarget) markDrop(null); });
document.addEventListener("drop", e => {
  if (![...e.dataTransfer.types].includes("Files")) return;
  e.preventDefault(); markDrop(null);
  const ta = dropBox(e.target), files = imageFiles(e.dataTransfer);
  if (ta && files.length) attachImages(ta, files);
});
document.addEventListener("paste", e => {
  const ta = e.target.closest && e.target.closest("textarea"), files = imageFiles(e.clipboardData);
  if (ta && files.length) { e.preventDefault(); attachImages(ta, files); }
});

showTab(tab);
// Poll while the page is in view. A hidden tab asks nothing, and catches up as soon as it is shown again.
refresh(); setInterval(() => { if (!document.hidden) refresh.poll(); }, 3000);
setInterval(() => { if (!document.hidden && tab !== "queue") refreshDesign.poll(); }, 1500);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  refresh.poll(); if (tab !== "queue") refreshDesign.poll();
});
</script>
</body>
